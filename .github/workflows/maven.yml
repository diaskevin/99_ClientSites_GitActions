# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MyRunner_ClientSites Java_Maven

on:
#  push:
#    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      test_class:
        description: 'Test class (or pattern) to run'
        required: true
        default: 'MyRunner_ClientSites.ANY_SIMPLE_Test'
        type: string


jobs:
  build:
    runs-on: ubuntu-latest


    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Google Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable



    - name: Run Selenium Test
      env:
        CI:'true'
      run: mvn test -Dtest="${{ inputs.test_class }}" -Dheadless=true


    - name: Generate Test Summary on Actions Page
      if: always()
      run: |
        python3 - << 'EOF' >> "$GITHUB_STEP_SUMMARY"
        import glob, os, xml.etree.ElementTree as ET

        files = sorted(glob.glob('target/surefire-reports/TEST-*.xml'))
        if not files:
            print("## ⚠️ No Test Reports Found")
            print("Maven did not generate any `target/surefire-reports/TEST-*.xml` files. Check the logs above for compilation errors or an invalid test class name.")
            exit(0)

        total_tests = total_passed = total_failed = total_errors = total_skipped = 0
        total_time = 0.0
        suite_sections = []

        for f in files:
            tree = ET.parse(f)
            root = tree.getroot()
            suite_name = root.attrib.get('name', os.path.basename(f))
            t_cnt = int(root.attrib.get('tests', 0))
            f_cnt = int(root.attrib.get('failures', 0))
            e_cnt = int(root.attrib.get('errors', 0))
            s_cnt = int(root.attrib.get('skipped', 0))
            p_cnt = t_cnt - f_cnt - e_cnt - s_cnt
            dur = float(root.attrib.get('time', 0.0))

            total_tests += t_cnt
            total_passed += p_cnt
            total_failed += f_cnt
            total_errors += e_cnt
            total_skipped += s_cnt
            total_time += dur

            lines = [f"### 📦 `{suite_name}` ({dur:.2f}s)", ""]
            lines.append("| Status | Test Method | Duration | Details / Console Output |")
            lines.append("| :--- | :--- | :--- | :--- |")

            failures_detail = []

            for tc in root.findall('testcase'):
                tc_name = tc.attrib.get('name', 'unknown')
                tc_time = float(tc.attrib.get('time', 0.0))
                failure = tc.find('failure')
                error = tc.find('error')
                skipped = tc.find('skipped')
                sysout = tc.find('system-out')

                out_preview = ""
                if sysout is not None and sysout.text and sysout.text.strip():
                    cleaned = " / ".join(line.strip() for line in sysout.text.strip().splitlines() if line.strip())
                    out_preview = f"`{cleaned[:120]}`"

                if failure is not None:
                    status = "❌ **FAILED**"
                    msg = (failure.attrib.get('message') or failure.attrib.get('type') or 'Assertion failed').splitlines()[0]
                    detail = f"**{msg}**"
                    failures_detail.append((tc_name, "Failure", failure.attrib.get('type', ''), failure.attrib.get('message', ''), failure.text or ''))
                elif error is not None:
                    status = "💥 **ERROR**"
                    msg = (error.attrib.get('message') or error.attrib.get('type') or 'Exception thrown').splitlines()[0]
                    detail = f"**{msg}**"
                    failures_detail.append((tc_name, "Error", error.attrib.get('type', ''), error.attrib.get('message', ''), error.text or ''))
                elif skipped is not None:
                    status = "⏭️ **SKIPPED**"
                    detail = skipped.attrib.get('message', 'Disabled / Skipped')
                else:
                    status = "✅ **PASSED**"
                    detail = out_preview or "—"

                detail = detail.replace("|", "\\|")
                lines.append(f"| {status} | `{tc_name}` | {tc_time:.2f}s | {detail} |")

            lines.append("")

            if failures_detail:
                lines.append("#### 🔍 Failure & Error Details")
                for tc_name, kind, err_type, err_msg, stack in failures_detail:
                    lines.append(f"<details open><summary>❌ <b>{tc_name}</b> ({kind}: <code>{err_type}</code>)</summary>\n")
                    if err_msg:
                        lines.append(f"**Why it failed:** `{err_msg.strip()}`\n")
                    if stack.strip():
                        lines.append(f"```text\n{stack.strip()}\n```")
                    lines.append("</details>\n")

            suite_sections.append("\n".join(lines))

        overall_icon = "✅" if (total_failed == 0 and total_errors == 0) else "❌"
        print(f"## {overall_icon} Selenium Test Results Summary")
        print("")
        print("| Total Tests | ✅ Passed | ❌ Failed | 💥 Errors | ⏭️ Skipped | ⏱️ Total Duration |")
        print("| :---: | :---: | :---: | :---: | :---: | :---: |")
        print(f"| **{total_tests}** | **{total_passed}** | **{total_failed}** | **{total_errors}** | **{total_skipped}** | **{total_time:.2f}s** |")
        print("")
        print("\n".join(suite_sections))
        EOF
        
        

